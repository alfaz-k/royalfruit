<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Portal — ROYAL NUTS & DRY FRUITS</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Cloudflare Turnstile Live API -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫘</text></svg>">
</head>
<body>

  <!-- Ambient Subtle Glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-badge">🌰</div>
      <span>ROYAL DRY FRUITS</span>
    </a>
    <a href="index.html" class="back-store-btn">← Back</a>
  </nav>

  <!-- Clean, Compact Auth Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Compact Header -->
      <div class="auth-header">
        <h2>Sign In to Royal</h2>
        <p>Access fast UPI checkouts & member savings</p>
      </div>

      <!-- Status / Alert Box -->
      <div class="auth-alert" id="authAlert" style="display: none;"></div>

      <!-- Priority 1: Instant Google Sign-In at Top -->
      <div class="google-auth-section">
        <button type="button" class="google-signin-btn" id="firebaseGoogleBtn" onclick="handleFirebaseGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or with email</span>
      </div>

      <!-- Segmented Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
        <button class="tab-btn" id="tabSignup" onclick="switchAuthTab('signup')">Create Account</button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form" id="loginForm" onsubmit="handleAuthSubmit(event, 'login')">
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="loginEmail" placeholder="e.g. rahul@gmail.com" required autocomplete="email" />
          </div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>Password</label>
            <a href="#" class="forgot-link" onclick="handleForgotClick(event)">Forgot?</a>
          </div>
          <div class="input-field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <!-- Cloudflare Turnstile Live Key -->
        <div class="captcha-box">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAETBrIfeDbpBxte0" data-theme="light" data-callback="onTurnstileSuccess"></div>
        </div>

        <button type="submit" class="auth-submit-btn" id="loginBtn">
          <span class="btn-text">Sign In →</span>
          <span class="btn-spinner" id="loginSpinner" style="display: none;"></span>
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signupForm" style="display: none;" onsubmit="handleAuthSubmit(event, 'signup')">
        <div class="input-group">
          <label>Full Name</label>
          <div class="input-field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="signupName" placeholder="e.g. Rahul Sharma" required autocomplete="name" />
          </div>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <div class="input-field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="signupEmail" placeholder="e.g. rahul@gmail.com" required autocomplete="email" />
          </div>
        </div>

        <div class="input-group">
          <label>Mobile Number</label>
          <div class="input-field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <input type="tel" id="signupPhone" placeholder="9876543210" pattern="[0-9]{10}" required autocomplete="tel" />
          </div>
        </div>

        <div class="input-group">
          <label>Create Password</label>
          <div class="input-field-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="signupPassword" placeholder="Min 6 characters" minlength="6" required autocomplete="new-password" />
          </div>
        </div>

        <!-- Cloudflare Turnstile Live Key -->
        <div class="captcha-box">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAETBrIfeDbpBxte0" data-theme="light" data-callback="onTurnstileSuccess"></div>
        </div>

        <button type="submit" class="auth-submit-btn" id="signupBtn">
          <span class="btn-text">Create Account →</span>
          <span class="btn-spinner" id="signupSpinner" style="display: none;"></span>
        </button>
      </form>

      <!-- Trust Footer -->
      <div class="auth-footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#174d34" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Secured 256-bit Cloudflare Encryption</span>
      </div>

    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
